$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/forgot-password'
description: 'Request a 4-digit OTP. Always 200. Copy devCode outside production.'
order: 2200
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{tag}}@kosply.test"
    }
