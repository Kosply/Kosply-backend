$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/logout'
description: 'End the session behind a refresh token (200). Works with an expired access token, because the refresh token is the credential that outlives it.'
order: 2300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
