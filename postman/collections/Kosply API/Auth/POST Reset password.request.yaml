$kind: http-request
method: POST
url: '{{baseUrl}}/api/auth/reset-password'
description: 'Set a new password with the OTP (paste devCode into resetCode first).'
order: 2300
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{tag}}@kosply.test",
      "code": "{{resetCode}}",
      "newPassword": "secret456"
    }
