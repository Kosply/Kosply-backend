# Kosply CI: Express server + database + kosmon CLI + helper scripts.
# The database job is not optional: without a live MariaDB every DB-backed test
# skips, `node --test` reports a skip as a pass, and the whole data layer ships
# unverified. That gap hid the auth, ownership and moderation defects fixed in
# the 2026-09 security pass.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  # Required by the internal-API guard; the internal tests assert 401 without it.
  INTERNAL_API_KEY: ci-internal-key
  # A value that is not the dev default, so the production guard does not trip.
  JWT_SECRET: ci-only-not-a-real-secret-0123456789

jobs:
  server:
    name: Express server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: kosply
          MARIADB_USER: kosply
          MARIADB_PASSWORD: kosply
          MARIADB_DATABASE: kosply_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            lib/db/package-lock.json
      - name: Install server dependencies
        run: npm ci

      - name: Install db dependencies
        working-directory: lib/db
        run: npm ci

      # No code generation step: the data layer is plain JavaScript and the
      # column registry is hand-written. The check below is the static
      # equivalent — it fails on a registry that names a column or relation that
      # does not exist.
      - name: Validate the column registry
        working-directory: lib/db
        run: node src/cli.js validate

      - name: Apply migrations (the deploy path does this too)
        working-directory: lib/db
        run: node src/cli.js deploy
        env:
          DATABASE_URL: mysql://kosply:kosply@localhost:3306/kosply_test

      # MariaDB grants MARIADB_USER only on MARIADB_DATABASE, so the scratch
      # database cannot be created as `kosply`. Create it as root and hand it to
      # the application role, which is what lib/db/docker/init.sh does locally.
      - name: Create the scratch database used by the drift check
        run: |
          mariadb -h 127.0.0.1 -uroot -pkosply -e \
            "CREATE DATABASE IF NOT EXISTS kosply_shadow;
             GRANT ALL PRIVILEGES ON kosply_shadow.* TO 'kosply'@'%';"

      # Deliberately the same helper `./scripts/db/db.sh drift` uses, rather
      # than a copy of the command: the two answers cannot drift apart. It
      # replays the migrations into kosply_shadow and compares the result
      # against lib/db/src/schema.js, in both directions.
      - name: Assert the schema matches the migration history (no drift)
        run: ./scripts/db/schema-diff.sh check
        env:
          DATABASE_URL: mysql://kosply:kosply@localhost:3306/kosply_test
          SHADOW_DATABASE_URL: mysql://kosply:kosply@localhost:3306/kosply_shadow

      - name: Seed fixtures
        working-directory: lib/db
        run: node schema/seed.js
        env:
          DATABASE_URL: mysql://kosply:kosply@localhost:3306/kosply_test
          NODE_ENV: test

      # A hand-maintained list of files rots silently: the next file added is
      # simply not checked. `npm test` requires every test module (and therefore
      # every module they import), and the smoke test below boots the app, so a
      # syntax error anywhere is caught without enumerating paths.
      - name: Syntax check (every tracked js file)
        run: |
          set -euo pipefail
          while IFS= read -r f; do node --check "$f"; done < <(git ls-files '*.js' ':!:node_modules' ':!lib/agent/**')
          echo "checked $(git ls-files '*.js' ':!:node_modules' ':!lib/agent/**' | wc -l) files"

      # The Postman catalog is maintained by hand in two formats. Nothing
      # checked either against the routes, so it silently fell behind: the
      # analytics POC was missing entirely, the seller review URL had a literal
      # `:id` that could never resolve, and every internal request omitted
      # `x-internal-key` and was therefore a guaranteed 401.
      - name: Postman catalog matches the server
        run: ./scripts/postman/validate.sh

      - name: Unit + integration tests (node:test, with a real database)
        run: npm test
        env:
          DATABASE_URL: mysql://kosply:kosply@localhost:3306/kosply_test

      # These two cases assert the *degraded* path (no DB configured), so they
      # only run when DATABASE_URL is unset. With it set workflow-wide they
      # skipped forever and the degradation behaviour was untested.
      - name: Degraded-mode tests (no database configured)
        run: node --test --test-timeout=60000 lib/server/tests/ai/ai.test.js lib/server/tests/ai/internal.test.js
        env:
          NODE_ENV: test
          INTERNAL_API_KEY: ${{ env.INTERNAL_API_KEY }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
        continue-on-error: false

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Syntax check (shell)
        run: bash -n scripts/server.sh

      - name: Smoke test (boot + health + a database-backed route)
        env:
          DATABASE_URL: mysql://kosply:kosply@localhost:3306/kosply_test
        run: |
          set -uo pipefail
          PORT=3100 node lib/server/server.js > /tmp/kosply-smoke.log 2>&1 &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3100/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          cat /tmp/kosply-smoke.log
          curl -sf http://localhost:3100/ | grep -q kosply-backend
          curl -sf http://localhost:3100/api/health | grep -q '"status":"ok"'
          # The old smoke test only hit dependency-free endpoints, so it passed
          # with a completely dead database. This one proves the data layer is
          # wired to a real MariaDB.
          curl -sf 'http://localhost:3100/api/models' | grep -q '"status":"ok"'
          # And that the internal API is not open.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/internal/users/anyone)
          test "$code" = "401" || { echo "internal API returned $code, expected 401"; exit 1; }

  agent:
    name: AI agent (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lib/agent/requirements*.txt
      - name: Install dependencies
        working-directory: lib/agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # The agent suite was never run by CI at all: 100+ tests, including the
      # security suite, only ran if a developer remembered.
      - name: Agent test suite
        working-directory: lib/agent
        run: pytest tests/ -q
        env:
          # Fail-closed is asserted too: the suite passes with the key unset,
          # because every /ai/* route must then refuse.
          INTERNAL_API_KEY: ci-internal-key
          OPENAI_API_KEY: ci-dummy-not-a-real-key
      - name: Python syntax + import check
        working-directory: lib/agent
        run: |
          python -m compileall -q app
          python -c "import app.main"
      - name: Python dependency audit
        working-directory: lib/agent
        run: pip install pip-audit && pip-audit -r requirements.txt || true
      - name: Agent image builds
        run: docker build -t kosply-agent:ci -f lib/agent/Dockerfile lib/agent

  monitor:
    name: kosmon CLI (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # No `cache-dependency-path`: the module has no external dependencies,
          # so no go.sum is ever generated and pointing at one makes the whole
          # job fail before it runs a single check.
          go-version-file: lib/server-monitoring/go.mod
      - name: gofmt
        working-directory: lib/server-monitoring
        # `test -z "$(gofmt -l .)"` passes when gofmt itself fails, because a
        # parse error goes to stderr and stdout stays empty.
        run: |
          out=$(gofmt -e -l . 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q '\.go'; then
            echo "gofmt reported unformatted files"
            exit 1
          fi
      - name: go vet
        working-directory: lib/server-monitoring
        run: go vet ./...
      - name: go build
        working-directory: lib/server-monitoring
        run: go build -o /tmp/kosmon .
      - name: kosmon smoke (non-interactive)
        working-directory: lib/server-monitoring
        run: |
          /tmp/kosmon list > /dev/null
          # `kosmon test` used to exit 0 on a 5xx, so `kosmon test X && deploy`
          # was a no-op gate.
          if /tmp/kosmon test /api/health --env staging >/dev/null 2>&1; then
            echo "kosmon test exited 0 with no server running (expected non-zero)"
            exit 1
          fi
