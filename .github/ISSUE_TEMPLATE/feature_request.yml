name: Feature request
description: Propose a new endpoint, CLI command, or improvement.
labels: [enhancement]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One clear sentence describing the feature.
      placeholder: Add kosmon logs command per environment
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - lib/server (Express API)
        - lib/server-monitoring (kosmon CLI)
        - scripts/
        - PM2 / deploy
        - docs
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What pain does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Commands, flags, menu placement, API shape.
      placeholder: |
        kosmon logs main --lines 50
        → streams kosply-server-main output like pm2 logs
  - type: checkboxes
    id: staging
    attributes:
      label: Staging-first check
      description: New runtime behavior must pass on staging before main.
      options:
        - label: I understand this must be tested on staging (`:3001`) first
