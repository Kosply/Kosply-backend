# Kosply local/staging data tier + AI agent.
# Security posture (fixed in the 2026-09 audit pass, kept through the MariaDB
# migration):
#  - MariaDB is no longer published on 0.0.0.0 with a committed credential.
#    The Node server runs under PM2 on the host and connects over 127.0.0.1,
#    so the port is bound to loopback only.
#  - Credentials come from the environment (a gitignored `.env`), not literals.
#  - The agent is reachable only on the compose network; it is not published to
#    the host, and it now requires INTERNAL_API_KEY on the server side.
#  - The agent is given a least-privilege role, not the database superuser: it
#    ingests buyer-controlled text into an LLM, so it should not be able to
#    read or write the production database.
services:
  mariadb:
    image: mariadb:11.4
    container_name: kosply-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_USER: ${MARIADB_USER:-kosply}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-kosply_dev}
      # Read by 01-init.sh to create the kosply_agent role's password and to
      # grant the app role access to the staging/main databases.
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-kosply}
    # Loopback only. A published 0.0.0.0 port with a known password is a
    # reachable database for anyone who can route to the host.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadata:/var/lib/mysql
      # Only init.sh goes in docker-entrypoint-initdb.d. It creates the
      # staging/main/agent databases, grants, and the least-privilege agent
      # role. Init only runs on an EMPTY data volume: rotating a password on a
      # live volume needs a manual ALTER USER.
      - ./lib/db/docker/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    # Default `json-file` logging has no size cap; a full disk stops MariaDB
    # writing, which is a cascading outage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  # One-shot: create the agent database's schema.
  #
  # `init.sh` creates `kosply_agent` EMPTY (deliberately: the agent gets its
  # own database and its own least-privilege role, so it cannot read
  # `kosply_main`). But the agent's ownership check queries `ai_conversations`,
  # so an unmigrated agent database made EVERY /ai/* route return 503
  # OwnershipCheckUnavailable while /health stayed green, and the server's
  # `ai_conversations`/`ai_messages` rows were never written.
  #
  # There is no code generation here: the migration runner is plain JavaScript
  # in ./src, so the container only has to install mysql2 and run it.
  migrate-agent:
    image: node:22-bookworm-slim
    container_name: kosply-migrate-agent
    restart: "no"
    working_dir: /db
    volumes:
      - ./lib/db:/db
    environment:
      # Least-privilege role created by init.sh, not the superuser: it owns
      # ONLY the kosply_agent database, so a compromised agent cannot read
      # kosply_main. (The pre-MariaDB compose connected as the superuser role
      # instead, which silently made the agent a superuser.)
      DATABASE_URL: mysql://kosply_agent:${AGENT_DB_PASSWORD:-kosply}@mariadb:3306/kosply_agent
    command: >
      sh -c "npm ci --omit=dev --no-audit --no-fund --loglevel=error &&
             node src/cli.js deploy"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - data

  agent:
    build: ./lib/agent
    container_name: kosply-agent
    restart: unless-stopped
    # Loopback only. The agent used to be published on 0.0.0.0:8000 with no
    # authentication, so anyone who could reach the host could spend the LLM
    # key and read any conversation. It is bound to 127.0.0.1 for the same
    # reason the database is: the server runs on the HOST and defaults to
    # `aiAgentUrl: http://localhost:8000`, so with `expose:` only (no reverse
    # proxy in this repo) every /api/ai/* route returned 503 ECONNREFUSED.
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    environment:
      PORT: 8000
      NODE_ENV: ${AGENT_NODE_ENV:-development}
      # Least-privilege role created by init.sh, not the superuser.
      DATABASE_URL: mysql://kosply_agent:${AGENT_DB_PASSWORD:-kosply}@mariadb:3306/kosply_agent
      KOSPLY_SERVER_URL: http://host.docker.internal:3000
      # Shared secret the server requires on /api/internal/*.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?set INTERNAL_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-openai:gpt-4o-mini}
      AI_RATE_LIMIT_PER_MIN: 60
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      mariadb:
        condition: service_healthy
      migrate-agent:
        condition: service_completed_successfully
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      # The agent boots LangGraph and an aiomysql pool at import; without a
      # start_period it latches `unhealthy` and `restart: unless-stopped`
      # does not act on `unhealthy`.
      start_period: 60s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Runs as the non-root user created in the Dockerfile.
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true

networks:
  data:
    driver: bridge

volumes:
  mariadata:
