services:
  postgres:
    image: postgres:16-alpine
    container_name: kosply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosply
      POSTGRES_PASSWORD: kosply
      POSTGRES_DB: kosply_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./lib/db/docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosply -d kosply_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
